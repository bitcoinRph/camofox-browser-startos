name: Monorepo verification (no publishing)

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'browser/**'
      - 'benchmark/**'
      - '.github/workflows/verify-monorepo.yml'
      - 'docs/SOURCES.md'

permissions:
  contents: read

concurrency:
  group: monorepo-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    container: node:24-trixie
    timeout-minutes: 30
    env:
      HOME: /root
    defaults:
      run:
        shell: bash
        working-directory: browser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - name: Install browser system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgtk-3-0 libnss3 libdbus-glib-1-2 libxt6 libasound2 \
            libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 \
            libxi6 libxrandr2 libxrender1 libxss1 libxtst6 \
            libegl1 libgl1-mesa-dri libgbm1 xvfb xauth \
            fonts-liberation fonts-noto-color-emoji ca-certificates curl unzip \
            build-essential python3
      - name: Install dependencies and pinned Camoufox assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm install --no-save jest-junit@17.0.0
          npm run fetch-bin
      - name: Verify browser assets and shared libraries
        run: |
          CACHE=$(node --input-type=module -e "import {loadConfig} from './lib/config.js'; console.log(loadConfig().camoufoxCacheDir)")
          RELEASE=$(node --input-type=module -e "import {BUNDLED_CAMOUFOX_RELEASE} from './lib/camoufox-download.js'; console.log(BUNDLED_CAMOUFOX_RELEASE)")
          node --input-type=module -e "import assert from 'node:assert/strict'; import fs from 'node:fs'; const v=JSON.parse(fs.readFileSync(process.argv[1])); assert.equal(v.version+'-'+v.release, process.argv[2])" "$CACHE/version.json" "$RELEASE"
          export LD_LIBRARY_PATH="$CACHE${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          : > libraries.log
          for library in camoufox-bin libxul.so libmozgtk.so; do
            ldd "$CACHE/$library" | tee -a libraries.log
            if grep -q 'not found' libraries.log; then exit 1; fi
          done
          "$CACHE"/camoufox-bin --version | tee browser-version.log
          grep -F "$RELEASE" browser-version.log
      - run: npm test
      - run: npm run test:mcp
      - run: node scripts/smoke-browser.mjs

  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: benchmark
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.9'
          cache: pip
          cache-dependency-path: benchmark/requirements.lock
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m bench.hygiene scan .
      - name: Verify frozen synthetic-v3 inventory
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path.cwd()
          fixture = root / 'fixtures/synthetic-v3'
          manifest = json.loads((fixture / 'manifest.json').read_text())
          for item in manifest['files']:
              actual = hashlib.sha256((root / item['path']).read_bytes()).hexdigest()
              assert actual == item['sha256'], item['path']
          pins = json.loads((fixture / 'pins.json').read_text())
          for name in ('manifest', 'bundle'):
              actual = hashlib.sha256((root / pins[f'{name}_path']).read_bytes()).hexdigest()
              assert actual == pins[f'{name}_sha256'], name
          print(f"verified {len(manifest['files'])} frozen files plus manifest and bundle pins")
          PY

  worker-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: benchmark/worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - run: npm test
      - run: npm run check
