# Safe offline baseline. No public route or custom domain is declared.
name = "camofox-botlab-fixture"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[observability]
enabled = false

[vars]
TURNSTILE_HOSTNAME = "botlab.example.com"
TURNSTILE_SITEKEY = ""

# TURNSTILE_SECRET and TRIAL_NONCE_SECRET must be supplied as secrets only.
# No paid bindings, storage, cron, analytics, or logging integrations.
